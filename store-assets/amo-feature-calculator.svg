<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f7f8f3"/>
      <stop offset="1" stop-color="#eaf1e5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-10%" width="140%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#203b24" flood-opacity=".16"/>
    </filter>
    <clipPath id="screen">
      <rect x="835" y="0" width="445" height="792" rx="26"/>
    </clipPath>
  </defs>
  <rect width="1280" height="800" fill="url(#wash)"/>
  <circle cx="727" cy="90" r="220" fill="#dbe8d5" opacity=".45"/>
  <circle cx="55" cy="785" r="185" fill="#dbe8d5" opacity=".4"/>
  <rect x="817" y="-18" width="481" height="840" rx="35" fill="#fff" filter="url(#shadow)"/>
  <image href="profitmr-screenshot-calculator.png" x="835" y="0" width="445" height="792" preserveAspectRatio="xMidYMid slice" clip-path="url(#screen)"/>
  <image href="../icon-128.png" x="74" y="78" width="66" height="66"/>
  <text x="158" y="122" fill="#315d37" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" letter-spacing=".4">ProfitMR</text>
  <text x="76" y="274" fill="#202820" font-family="Segoe UI, Arial, sans-serif" font-size="51" font-weight="700">Compare cartões.</text>
  <text x="76" y="337" fill="#202820" font-family="Segoe UI, Arial, sans-serif" font-size="51" font-weight="700">Planeje seus pontos.</text>
  <text x="78" y="405" fill="#58645a" font-family="Segoe UI, Arial, sans-serif" font-size="24">Estime combinações com os custos</text>
  <text x="78" y="440" fill="#58645a" font-family="Segoe UI, Arial, sans-serif" font-size="24">e o saldo que você informar.</text>
  <rect x="78" y="500" width="250" height="50" rx="25" fill="#e1ecdc"/>
  <circle cx="105" cy="525" r="8" fill="#4c7851"/>
  <text x="124" y="533" fill="#315d37" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Cálculo estimado</text>
  <rect x="342" y="500" width="246" height="50" rx="25" fill="#e1ecdc"/>
  <circle cx="370" cy="525" r="8" fill="#4c7851"/>
  <text x="389" y="533" fill="#315d37" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Dados salvos localmente</text>
  <text x="78" y="710" fill="#687168" font-family="Segoe UI, Arial, sans-serif" font-size="16">Captura ilustrativa com valores de demonstração.</text>
  <text x="78" y="738" fill="#687168" font-family="Segoe UI, Arial, sans-serif" font-size="16">Confira os custos atuais no Rewards antes de resgatar.</text>
</svg>
